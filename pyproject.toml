[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglsim"
version = "0.1.0"
description = "CPU-only SGLang scheduling and KV-cache simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2",
  "aiconfigurator @ git+https://github.com/ai-dynamo/aiconfigurator.git",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "orjson>=3.9",
]
test = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "orjson>=3.9",
  "pytest>=8",
  "uvicorn>=0.27",
]
benchmark = [
  "transformers>=4.40",
]

[project.scripts]
sglsim-serve = "sglsim.launch_server:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
pythonpath = ["python", "."]
