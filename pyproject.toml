[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglsim"
version = "0.1.0"
description = "CPU-only SGLang scheduling and KV-cache simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "orjson>=3.9",
]
aiconfigurator = [
  "aiconfigurator",
]
native = [
  "IPython",
  "aiohttp>=3.9",
  "anthropic>=0.20.0",
  "compressed-tensors",
  "dill",
  "einops",
  "fastapi>=0.110",
  "gguf",
  "httpx>=0.27",
  "llguidance>=0.7.11,<0.8.0",
  "mistral_common>=1.9.0",
  "ninja",
  "nvidia-ml-py",
  "openai-harmony==0.0.4",
  "interegular",
  "msgspec",
  "openai>=2.6.1",
  "orjson>=3.9",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil>=5.9",
  "python-multipart",
  "pybase64",
  "pyzmq>=25",
  "requests>=2.31",
  "sentencepiece",
  "setproctitle",
  "soundfile==0.13.1",
  "tiktoken",
  "timm==1.0.16",
  "torch_memory_saver==0.0.9",
  "torchao==0.9.0",
  "torchaudio",
  "torchcodec",
  "torch",
  "torchvision",
  "tqdm",
  "transformers>=4.51",
  "triton",
  "uvicorn>=0.27",
  "uvloop>=0.19",
  "xgrammar==0.1.32",
]
test = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "orjson>=3.9",
  "pytest>=8",
  "uvicorn>=0.27",
]

[project.scripts]
sglsim = "sglsim.launch_server:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
pythonpath = ["python"]
